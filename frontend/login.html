<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - BiteFleet</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 50%, #fed7aa 100%);
    }
    .auth-card-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }
    .auth-card {
      background: white;
      border-radius: var(--radius-lg);
      padding: 40px;
      max-width: 440px;
      width: 100%;
      box-shadow: var(--shadow-xl);
      border: 1px solid var(--border-light);
    }
    .form-group {
      margin-bottom: 20px;
      position: relative;
    }
    .form-group label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 6px;
    }
    .input-with-icon {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-with-icon i.input-icon {
      position: absolute;
      left: 14px;
      color: var(--text-light);
    }
    .input-with-icon input {
      width: 100%;
      padding: 12px 40px 12px 40px;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      outline: none;
      transition: all var(--transition-fast);
    }
    .input-with-icon input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
    }
    .pwd-toggle-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: var(--text-light);
      cursor: pointer;
      padding: 4px;
      font-size: 1rem;
    }
    .pwd-toggle-btn:hover {
      color: var(--text-main);
    }
  </style>
</head>
<body class="auth-page">

  <!-- Header -->
  <header class="site-header"></header>

  <div class="auth-card-wrap">
    <div class="auth-card">
      <div style="text-align: center; margin-bottom: 28px;">
        <div style="width: 56px; height: 56px; border-radius: var(--radius-md); background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; margin: 0 auto 12px; box-shadow: var(--shadow-md);">
          🍔
        </div>
        <h1 style="font-size: 1.6rem; font-weight: 800; color: var(--accent); margin-bottom: 6px;">Welcome Back</h1>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Sign in to track orders, manage favourites, and checkout quickly.</p>
      </div>

      <div id="errorBox" style="display: none; background: var(--nonveg-bg); border-left: 4px solid var(--error); color: var(--error); padding: 12px 14px; border-radius: var(--radius-sm); font-size: 0.88rem; margin-bottom: 20px;"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <div class="input-with-icon">
            <i class="fas fa-envelope input-icon"></i>
            <input type="email" id="email" placeholder="name@example.com" required autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-with-icon">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
            <button type="button" class="pwd-toggle-btn" onclick="togglePasswordVisibility('password', this)" title="Toggle password visibility" aria-label="Toggle password visibility">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="loginBtn" class="btn btn-primary btn-block" style="padding: 12px; font-size: 1rem; margin-top: 10px;">
          <span>Sign In</span> <i class="fas fa-arrow-right"></i>
        </button>
      </form>

      <div style="text-align: center; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border-light); font-size: 0.92rem; color: var(--text-muted);">
        Don't have an account yet? 
        <a href="signup.html" style="font-weight: 700; color: var(--primary-dark); text-decoration: none;">Create an account</a>
      </div>
    </div>
  </div>

  <footer class="site-footer"></footer>

  <script src="main.js"></script>
  <script>
    renderNavbar();
    renderFooter();

    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon = btn.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fas fa-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'fas fa-eye';
      }
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const loginBtn = document.getElementById('loginBtn');
      const errorBox = document.getElementById('errorBox');

      loginBtn.disabled = true;
      loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';
      errorBox.style.display = 'none';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('token', data.token);
          showToast(`Welcome back, ${data.user.username}!`, 'success');
          
          setTimeout(() => {
            if (data.user.role === 'admin') {
              window.location.href = 'admin/dashboard.html';
            } else {
              window.location.href = 'customer/menu.html';
            }
          }, 800);
        } else {
          errorBox.textContent = data.message || 'Invalid email or password.';
          errorBox.style.display = 'block';
        }
      } catch (err) {
        console.error('Login error:', err);
        errorBox.textContent = 'Network connection error. Please try again.';
        errorBox.style.display = 'block';
      } finally {
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<span>Sign In</span> <i class="fas fa-arrow-right"></i>';
      }
    });
  </script>
</body>
</html>
