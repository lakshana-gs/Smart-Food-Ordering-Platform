<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Saved Favourites - BiteFleet</title>
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Dynamic Header -->
  <header class="site-header"></header>

  <main class="container" style="padding-top: 36px; padding-bottom: 80px;">
    <!-- Page Header -->
    <div style="margin-bottom: 28px;">
      <h1 style="font-size: 2.2rem; font-weight: 800; color: var(--accent); margin-bottom: 4px;">
        <i class="fas fa-heart" style="color: var(--nonveg-color);"></i> Your Saved Dishes
      </h1>
      <p style="color: var(--text-muted); font-size: 1rem;">Dishes you've saved for quick and easy ordering anytime.</p>
    </div>

    <!-- Loading State -->
    <div id="favLoading" style="text-align: center; padding: 60px 0; color: var(--text-muted);">
      <i class="fas fa-spinner fa-spin fa-2x"></i>
      <p style="margin-top: 12px;">Loading your saved favourites...</p>
    </div>

    <!-- Empty State -->
    <div id="favEmpty" class="empty-state" style="display: none;">
      <div class="empty-state-icon">❤️</div>
      <h2 class="empty-state-title">No Saved Dishes Yet</h2>
      <p class="empty-state-desc">You can save your favourite dishes by clicking the heart icon on any dish card while browsing the menu.</p>
      <a href="menu.html" class="btn btn-primary">
        <i class="fas fa-utensils"></i> Browse Menu
      </a>
    </div>

    <!-- Favourites Grid -->
    <div id="favGrid" class="food-grid" style="display: none;"></div>
  </main>

  <footer class="site-footer"></footer>

  <script src="../main.js"></script>
  <script>
    renderNavbar('favourites');
    renderFooter();

    async function loadFavourites() {
      const token = getToken();
      if (!token) {
        document.getElementById('favLoading').style.display = 'none';
        document.getElementById('favEmpty').style.display = 'block';
        return;
      }

      try {
        const res = await fetch('/api/favourites', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!res.ok) throw new Error('Failed to load favourites');

        const items = await res.json();
        document.getElementById('favLoading').style.display = 'none';

        if (!items || items.length === 0) {
          document.getElementById('favEmpty').style.display = 'block';
          document.getElementById('favGrid').style.display = 'none';
          return;
        }

        document.getElementById('favEmpty').style.display = 'none';
        const grid = document.getElementById('favGrid');
        grid.style.display = 'grid';

        grid.innerHTML = items.map(item => {
          const isVeg = (item.dietary || '').toLowerCase() === 'veg';
          const price = parseFloat(item.price).toFixed(2);
          const isAvailable = Boolean(item.is_available);

          return `
            <div class="food-card" data-id="${item.id}">
              <div class="food-card-media">
                <span class="food-card-emoji">${item.emoji || '🍽️'}</span>
                <span class="food-card-prep"><i class="far fa-clock"></i> ${item.prep_minutes || 20}m</span>
                ${!isAvailable ? '<span class="sold-out-badge">Sold Out</span>' : ''}
                <button class="favourite-btn active" onclick="removeFromFav(${item.id})" title="Remove from Favourites">
                  <i class="fas fa-heart" style="color: #dc2626;"></i>
                </button>
              </div>

              <div class="food-card-body">
                <div class="food-card-header">
                  <span class="dietary-mark ${isVeg ? 'veg' : 'non-veg'}"></span>
                  <span class="rating-badge">★ ${item.rating || '4.5'}</span>
                </div>

                <h3 class="food-card-title">${item.name}</h3>
                <p class="food-card-desc">${item.description || 'Fresh gourmet meal prepared by our expert kitchen staff.'}</p>

                <div class="food-card-footer">
                  <div class="food-price">Rs. ${price}</div>
                  ${isAvailable ? `
                    <button class="add-btn" onclick="addToCartApi(${item.id})">
                      <i class="fas fa-plus"></i> Add to Cart
                    </button>
                  ` : `
                    <button class="btn btn-secondary btn-sm" disabled>Sold Out</button>
                  `}
                </div>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        console.error('Favourites error:', err);
        document.getElementById('favLoading').innerHTML = `
          <div style="color: var(--error);">
            <i class="fas fa-exclamation-circle fa-2x"></i>
            <p style="margin-top: 10px;">Failed to load favourites. Please try again.</p>
          </div>
        `;
      }
    }

    async function removeFromFav(menuId) {
      const token = getToken();
      try {
        const res = await fetch(`/api/favourites/${menuId}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.ok) {
          showToast('Item removed from favourites', 'info');
          loadFavourites();
        }
      } catch (e) {
        showToast('Error removing favourite', 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', loadFavourites);
  </script>
</body>
</html>
